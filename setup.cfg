[flake8]
max-line-length = 79
max-complexity = 12
exclude =
    .git,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
    .venv,
    venv,
    build,
    dist

[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_ignores = True
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True
exclude = (^\.venv/|^venv/|^build/|^dist/)
